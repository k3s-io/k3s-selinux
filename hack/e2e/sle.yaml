images:
# The sle policy targets SLES 16 and SL Micro 6.x, which require a SUSE registration:
# test it on openSUSE Leap 16, the same base (SELinux enforcing by default, cloud-init).
#
# No digest: only the latest build is kept on the mirror (Leap-16.0-Minimal-VM.<arch>-Cloud-Build<N>.qcow2)
# and it is rebuilt with every maintenance update, so any pinned build or digest breaks within days.
- location: https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2
  arch: x86_64

- location: https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.aarch64-Cloud.qcow2
  arch: aarch64
